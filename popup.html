<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>탭 클릭 후 닫기</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/yuzu.svg" alt="" class="logo">
    <div>
      <h1>탭 클릭 후 닫기</h1>
      <p class="sub">클릭 → 닫기 → 대기, 마지막 탭은 남겨요</p>
    </div>
  </header>

  <section class="card timer">
    <div class="ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="44"/>
        <circle id="ringBar" class="bar" cx="50" cy="50" r="44" pathLength="100"/>
      </svg>
      <div class="ring-center">
        <span id="countdown" class="count">–</span>
        <span id="countLabel" class="count-label">대기 중</span>
      </div>
    </div>
    <div class="timer-side">
      <div id="progress" class="progress">대기 중</div>
      <div class="bar-line"><div id="progressBar"></div></div>
      <div id="status" class="status"></div>
      <div class="row">
        <button id="start" class="primary">시작</button>
        <button id="stop" class="danger">중지</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>클릭할 위치</h2>
      <button id="clearTarget" class="link" title="저장된 위치 삭제">지우기</button>
    </div>
    <div id="target" class="target">저장된 위치 없음</div>
    <button id="pick" class="secondary">위치 지정</button>
  </section>

  <section class="card">
    <h2>설정</h2>
    <label class="field"><span>클릭 방식</span>
      <select id="clickMode">
        <option value="element">요소 (선택자)</option>
        <option value="coords">좌표 (x, y)</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="coordFallback"> 요소를 못 찾으면 좌표로 클릭</label>
    <label class="field"><span>탭 사이 대기</span>
      <span class="unit"><input type="number" id="delaySec" min="0" step="0.5">초</span>
    </label>
    <label class="field"><span>클릭 후 닫기 전 대기</span>
      <span class="unit"><input type="number" id="afterClickSec" min="0" step="0.5">초</span>
    </label>
    <label class="field"><span>요소 찾기 최대 대기</span>
      <span class="unit"><input type="number" id="findTimeoutSec" min="0" step="1">초</span>
    </label>
    <label class="field"><span>순서</span>
      <select id="order">
        <option value="current">현재 탭부터 오른쪽으로</option>
        <option value="first">맨 왼쪽 탭부터</option>
      </select>
    </label>
    <label class="field"><span>못 찾으면</span>
      <select id="onNotFound">
        <option value="stop">중지</option>
        <option value="skip">건너뛰기 (탭 유지)</option>
      </select>
    </label>
  </section>

  <details class="card log">
    <summary>기록</summary>
    <pre id="log"></pre>
  </details>

  <script src="popup.js"></script>
</body>
</html>
